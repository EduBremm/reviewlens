stages:
  download:
    cmd: python -m src.data.download
    deps: [src/data/download.py]
    params: [data.url, data.sha256]
    outs: [data/raw/reviews.csv]
  validate:
    cmd: python -m src.data.validate
    deps: [src/data/validate.py, data/raw/reviews.csv]
    metrics: [{reports/quality.json: {cache: false}}]
  build_features:
    cmd: python -m src.features.build
    deps: [src/features/build.py, src/features/text.py, data/raw/reviews.csv]
    params: [seed, features]
    outs: [data/processed/reviews_clean.parquet, data/processed/train.parquet, data/processed/test.parquet]
    metrics: [{reports/preparation.json: {cache: false}}]
  eda:
    cmd: python -m src.analysis.eda
    deps: [src/analysis/eda.py, data/processed/reviews_clean.parquet]
    metrics: [{reports/eda.json: {cache: false}}]
  train:
    cmd: python -m src.models.train
    deps: [src/models/train.py, src/models/candidates.py, src/features/transformers.py, src/features/text.py,
           data/processed/train.parquet]
    params: [seed, train]
    outs: [models/model.joblib, {models/model_card.json: {cache: false}}]
    metrics: [{reports/cv_results.json: {cache: false}}]
  evaluate:
    cmd: python -m src.models.evaluate
    deps: [src/models/evaluate.py, models/model.joblib, data/processed/test.parquet]
    metrics: [{reports/metrics.json: {cache: false}}]
  clustering:
    cmd: python -m src.analysis.clustering
    deps: [src/analysis/clustering.py, data/processed/reviews_clean.parquet]
    params: [seed, clustering]
    outs: [models/clusters.joblib, data/processed/neg_clusters.parquet]
    metrics: [{reports/clusters.json: {cache: false}}]
  load_db:
    cmd: python -m src.analysis.load_db
    deps: [src/analysis/load_db.py, src/db.py, models/model.joblib, data/processed/neg_clusters.parquet]
    outs: [data/reviewlens.db]
